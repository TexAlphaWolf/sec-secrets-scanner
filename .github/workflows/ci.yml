name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  windows:
    name: test (Python 3.14, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pytest

  evaluation:
    name: detection quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Recall on generated secrets and false positives on benign lines
        run: |
          python tools/evaluate.py --n 100 | tee eval.txt
          grep -q "benign lines flagged: 0 of" eval.txt
          # Overall recall must stay at or above 99.5%
          awk '/^overall recall:/ { gsub("%", "", $3); if ($3 + 0 < 99.5) exit 1 }' eval.txt
          grep -q "^overall recall:" eval.txt
      - name: The scanner finds nothing in its own repository
        run: secscan scan .

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t secscan .
      - name: Runs as a normal user
        run: '[ "$(docker run --rm --entrypoint id secscan -u)" != 0 ]'
      - name: Finds a secret in a mounted repository, read-only, with no network
        run: |
          set -e
          mkdir demo && cd demo
          git init -q -b main
          token="ghp_$(head -c 200 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'TOKEN = "%s"\n' "$token" > config.py
          git add . && git -c user.name=ci -c user.email=ci@example.org commit -q -m demo
          set +e
          docker run --rm --read-only --cap-drop ALL --network none -v "$PWD:/repo:ro" secscan scan | tee ../out.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 1 ]
          grep -q "config.py:1:" ../out.txt
          grep -q "github-token" ../out.txt
          ! grep -q "$token" ../out.txt
      - name: A clean repository exits 0
        run: |
          mkdir clean && cd clean
          git init -q -b main
          echo 'print("hello")' > hello.py
          docker run --rm --read-only --cap-drop ALL --network none -v "$PWD:/repo:ro" secscan scan
